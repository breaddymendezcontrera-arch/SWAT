<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWT DESCRIPTION OF PLACE</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#000;--mute:#4d4d4d;--line:#d9d9d9;--green:#2E9E3F;--greenink:#1d7a2d;--panel:#000;--panelink:#fff;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mute:#b3b3b3;--line:#333;--greenink:#5fd36f;--panel:#fff;--panelink:#000}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mute:#b3b3b3;--line:#333;--greenink:#5fd36f;--panel:#fff;--panelink:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:'Lilita One',Impact,sans-serif;margin:0;line-height:1}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--bg);border-bottom:2px solid var(--ink)}
.top b{font-family:'Lilita One',sans-serif;font-weight:800;font-size:20px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.brand img{height:50px;width:auto;background:#fff;border-radius:8px;padding:3px 6px;display:block}
.menu-btn{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:10px 18px;font:600 16px Nunito,sans-serif;cursor:pointer}
.menu-btn i{display:block;width:18px;height:2px;background:currentColor;box-shadow:0 6px 0 currentColor,0 -6px 0 currentColor;transition:transform .2s}
.menu-btn[aria-expanded=true] i{transform:rotate(90deg)}
#drawer{position:fixed;inset:0;z-index:20;visibility:hidden}
#drawer.open{visibility:visible}
.shade{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .25s}
.open .shade{opacity:1}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(400px,92vw);background:var(--panel);color:var(--panelink);padding:calc(20px + env(safe-area-inset-top,0px)) 24px 30px;overflow-y:auto;transform:translateX(100%);transition:transform .28s ease}
.open .sheet{transform:none}
.sheet .x{float:right;background:none;border:2px solid currentColor;color:inherit;border-radius:99px;width:40px;height:40px;font-size:20px;cursor:pointer}
.sheet h2{font-size:15px;font-family:Nunito,sans-serif;font-weight:600;opacity:.65;margin:30px 0 8px}
.sheet a{display:block;padding:11px 0;text-decoration:none;font:800 24px 'Lilita One',sans-serif;border-bottom:1px solid #8884}
.sheet a span{display:block;font:400 14px Nunito,sans-serif;opacity:.7}
.sheet a:hover,.sheet a[aria-current]{color:var(--green)}
.pk{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid #8884;color:inherit;padding:11px 0;font:800 24px 'Lilita One',sans-serif;text-align:left;cursor:pointer}
.pk:after{content:"+";font-size:28px;transition:transform .2s}
.pk[aria-expanded=true]:after{transform:rotate(45deg)}
.pk[aria-expanded=true]{color:var(--green)}
.sub{margin:6px 0 10px 4px;border-left:3px solid var(--green)}
.sub a{font-size:19px;padding:9px 0 9px 14px;border-bottom:0}
.view{display:none}.view.on{display:block}
main{max-width:1040px;margin:0 auto;padding:0 20px 70px}
.hero{background:var(--green);color:#fff;margin:0 -20px;padding:70px 20px 80px;min-height:min(70vh,560px);display:flex;flex-direction:column;justify-content:flex-end}
.hero>*{width:100%;max-width:1000px;margin-inline:auto}
.hero h1{font-size:clamp(56px,13vw,150px);font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 span{color:#000}
.hero p{font-size:20px;max-width:480px;margin:22px auto 28px 0;color:#fff}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 22px;border-radius:99px;font:600 17px Nunito,sans-serif;text-decoration:none;border:2px solid #fff;color:#fff;background:none;cursor:pointer}
.btn.dark{background:#000;border-color:#000}
.head{background:linear-gradient(135deg,#1F8F3A 0%,#0E4A22 100%);color:#fff;margin:0 -20px;padding:48px 20px 40px}
.head>*{max-width:1000px;margin-inline:auto}
.head .exit{display:inline-block;color:#fff;font-weight:600;margin-bottom:18px;border-bottom:2px solid #CFF8D6;text-decoration:none}
.head .where{color:#CFF8D6;font-weight:600}
.head h1{font-size:clamp(44px,9vw,104px);font-weight:800;text-transform:uppercase;margin-top:10px}
.cols{display:grid;grid-template-columns:1fr 290px;gap:36px;align-items:start;margin-top:36px}
.pass{background:var(--green);color:#fff;border-radius:16px;padding:24px;position:sticky;top:84px}
.pass dt{font-size:14px;opacity:.9}
.pass dd{margin:0 0 16px;font-weight:600;font-size:18px}
.pass .pay{font:800 56px/1 'Lilita One',sans-serif;color:#000}
.pass .pay small{font:600 18px Nunito,sans-serif}
.sec{padding:20px 0;border-top:2px solid var(--ink)}
.sec:first-child{border-top:0;padding-top:0}
.sec h3{font-size:22px;margin-bottom:8px;color:var(--greenink)}
.sec p{margin:0 0 8px;max-width:68ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager .btn{color:var(--ink);border-color:var(--ink)}
.park{margin-top:48px}
.park h2{font-size:34px;text-transform:uppercase}
.park small{display:block;color:var(--mute);margin:6px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.stub{display:flex;flex-direction:column;justify-content:space-between;min-height:160px;padding:20px;border:2px solid var(--ink);border-radius:16px;text-decoration:none;color:var(--ink);transition:background .15s,color .15s}
.stub h3{font-size:26px}
.stub span{color:var(--mute);font-size:15px}
.stub em{font:800 22px 'Lilita One',sans-serif;font-style:normal;color:var(--greenink)}
.stub:hover{background:var(--green);border-color:var(--green);color:#fff}
.stub:hover span,.stub:hover em{color:#fff}
.pass .pay2{font:800 36px/1.1 'Lilita One',sans-serif;color:#000}
.pass .pay{font-size:44px}
.ul{margin:0;padding-left:20px;max-width:68ch}.ul li{margin-bottom:8px}
.tbl{width:100%;border-collapse:collapse;max-width:700px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--line)}
.tbl th{width:34%;font-weight:600;color:var(--greenink)}
.stub em{font-size:18px}
.photo{margin:28px 0 28px;border-radius:16px;overflow:hidden;aspect-ratio:16/7;background:var(--green)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#fff;font:800 clamp(24px,5vw,44px)/1.1 'Lilita One',sans-serif;background:repeating-linear-gradient(135deg,#2E9E3F 0 24px,#2a9139 24px 48px)}
body{font-synthesis:none;overflow-x:hidden;background-color:var(--green);background-image:radial-gradient(#ffffff40 2.5px,transparent 3px);background-size:34px 34px}
main{background:var(--bg);box-shadow:0 0 0 4px #000}
.hero,.head{margin-left:calc(50% - 50vw)!important;margin-right:calc(50% - 50vw)!important;padding-left:max(20px,calc(50vw - 500px))!important;padding-right:max(20px,calc(50vw - 500px))!important}
.hero{background-image:radial-gradient(#ffffff2e 3px,transparent 3.5px);background-size:34px 34px}
.head{border-bottom:6px solid #8BE3A0}
.hero h1,.head h1{letter-spacing:.01em}
.stub{border-width:3px;border-radius:22px}
.stub:hover{transform:translateY(-4px) rotate(-.7deg)}
.prow{display:flex;align-items:center;border-bottom:1px solid #8884}
.sheet .prow a{flex:1;border-bottom:0}
.pt{background:none;border:0;color:inherit;width:44px;height:44px;font-size:28px;cursor:pointer;transition:transform .2s}
.pt[aria-expanded=true]{transform:rotate(45deg);color:var(--green)}
.tag{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:99px;background:var(--green);color:#fff;font:700 13px Nunito,sans-serif}
.tag.big{font-size:16px;padding:5px 16px;margin-top:14px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.pass{position:static;order:-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ===== Refresh visual corporativo 2027 ===== */
:root,
:root[data-theme="dark"]{
  --bg:#F7FAF7;
  --ink:#172019;
  --mute:#647067;
  --line:#DCE5DE;
  --green:#2E9E3F;
  --greenink:#1E7D31;
  --green-dark:#155D29;
  --green-soft:#EAF6EC;
  --state-title:#C79A2B;
  --panel:#F4FBF5;
  --panelink:#172019;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#F7FAF7;
    --ink:#172019;
    --mute:#647067;
    --line:#DCE5DE;
    --green:#2E9E3F;
    --greenink:#1E7D31;
    --panel:#F4FBF5;
    --panelink:#172019;
    color-scheme:light;
  }
}
body{
  background-color:#EEF6EF;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(46,158,63,.12) 0 2px,transparent 2.5px),
    radial-gradient(circle at 88% 72%,rgba(46,158,63,.08) 0 2px,transparent 2.5px);
  background-size:38px 38px,54px 54px;
  color:var(--ink);
}
main{
  background:var(--bg);
  box-shadow:0 18px 55px rgba(18,53,28,.10);
}
.top{
  background:rgba(255,255,255,.94);
  border-bottom:1px solid rgba(23,32,25,.10);
  box-shadow:0 8px 24px rgba(18,53,28,.06);
  backdrop-filter:blur(12px);
}
.brand{color:var(--ink)}
.brand img{
  border-radius:12px;
  padding:4px 8px;
  box-shadow:0 5px 16px rgba(18,53,28,.08);
}
.top b{letter-spacing:.02em}
.menu-btn{
  background:var(--green);
  color:#fff;
  box-shadow:0 8px 20px rgba(46,158,63,.20);
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.menu-btn:hover{
  background:var(--green-dark);
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(46,158,63,.26);
}
.shade{background:rgba(12,30,17,.36);backdrop-filter:blur(3px)}
.sheet{
  background:#F8FCF8;
  color:var(--ink);
  border-left:1px solid rgba(46,158,63,.14);
  box-shadow:-22px 0 60px rgba(13,54,24,.16);
}
.sheet .x{border-color:#BFD7C4;background:#fff;color:var(--ink)}
.sheet h2{color:var(--greenink);opacity:1;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.sheet a,.pk,.prow{border-bottom-color:#DFE8E1}
.sheet a:hover,.sheet a[aria-current],.pk[aria-expanded=true]{color:var(--greenink)}
.sub{background:var(--green-soft);border-left-color:var(--green);border-radius:0 12px 12px 0;padding:3px 8px 3px 0}
.hero{
  min-height:min(68vh,560px);
  background:
    radial-gradient(circle at 83% 18%,rgba(255,255,255,.16) 0 3px,transparent 3.5px) 0 0/34px 34px,
    linear-gradient(135deg,#34A947 0%,#278D39 58%,#1C7131 100%);
  position:relative;
  overflow:hidden;
}
.hero:after{
  content:"";
  position:absolute;
  width:360px;height:360px;
  right:-90px;top:-110px;
  border:58px solid rgba(255,255,255,.08);
  border-radius:50%;
  pointer-events:none;
}
.hero>*{position:relative;z-index:1}
.hero h1{max-width:900px;text-shadow:0 4px 18px rgba(16,72,29,.12)}
.hero h1 span{
  color:#fff;
  display:inline-block;
  background:rgba(15,75,29,.30);
  border:1px solid rgba(255,255,255,.24);
  padding:.04em .13em .08em;
  border-radius:.18em;
  margin-top:.08em;
}
.hero p{max-width:590px;font-size:21px;line-height:1.55;color:rgba(255,255,255,.94)}
.btn{
  border-color:rgba(255,255,255,.82);
  background:rgba(255,255,255,.08);
  font-weight:800;
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}
.btn.dark{
  background:#fff;
  border-color:#fff;
  color:var(--green-dark);
  box-shadow:0 9px 22px rgba(13,74,30,.16);
}
.btn.dark:hover{background:#F3FFF5}
.head{
  background:linear-gradient(135deg,#28983D 0%,#1F8135 55%,#17652C 100%);
  border-bottom:0;
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.16);
}
.head .exit{
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);
  border-radius:999px;
  padding:7px 13px;
  margin-bottom:20px;
}
.head .where{color:#DDF6E2;letter-spacing:.02em}

.head.has-hero{background:linear-gradient(135deg,rgba(20,112,45,.24) 0%,rgba(11,58,27,.28) 100%), var(--head-bg) center center/cover no-repeat!important;position:relative;overflow:hidden}
.head.has-hero h1,.head.has-hero .where,.head.has-hero .exit{position:relative;z-index:1;color:#fff!important;text-shadow:0 3px 14px rgba(0,0,0,.38)}
.head.has-hero .exit{border:1px solid rgba(255,255,255,.28);padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:8px;border-bottom-width:1px}
.head.has-hero .exit:hover{background:rgba(255,255,255,.16)}

.cols{gap:42px}
.pass{
  background:#fff;
  color:var(--ink);
  border:1px solid #DDE8DF;
  border-top:5px solid var(--green);
  box-shadow:0 14px 36px rgba(20,74,34,.10);
  border-radius:20px;
}
.pass dt{color:var(--mute);opacity:1;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.pass dd{color:var(--ink)}
.pass .pay,.pass .pay2{color:var(--greenink)}
.pass a,.pass a[style]{color:var(--greenink)!important;font-weight:800;text-decoration-thickness:1.5px;text-underline-offset:3px}
.sec{
  border-top:1px solid var(--line);
  padding:26px 0;
}
.sec h3{color:var(--greenink);font-size:24px;letter-spacing:.01em}
.sec p,.ul{color:#374039}
.tbl th{color:var(--greenink)}
.tbl th,.tbl td{border-bottom-color:var(--line);padding-top:12px;padding-bottom:12px}
.park{margin-top:56px}
.park h2{color:var(--state-title);font-size:38px}
.park small{color:var(--mute)}
.grid{gap:18px}
.stub{
  min-height:176px;
  background:#fff;
  border:1px solid #DCE6DE;
  border-radius:20px;
  box-shadow:0 7px 20px rgba(19,65,31,.06);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
.stub h3{color:var(--ink)}
.stub span{color:var(--mute)}
.stub em{color:var(--greenink)}
.stub:hover{
  background:var(--green-soft);
  border-color:#A9D8B2;
  color:var(--ink);
  transform:translateY(-5px);
  box-shadow:0 14px 30px rgba(30,125,49,.12);
}
.stub:hover h3{color:var(--ink)}
.stub:hover span{color:var(--mute)}
.stub:hover em{color:var(--greenink)}
.photo{
  border-radius:22px;
  background:var(--green-soft);
  box-shadow:0 12px 34px rgba(20,74,34,.10);
}
.ph{
  color:var(--green-dark);
  background:linear-gradient(135deg,#E9F7EC,#D8EFDD);
}
.tag{background:var(--green-soft);color:var(--greenink);border:1px solid #C7E6CD}
.pager .btn{
  color:var(--greenink);
  border-color:#B9D9BF;
  background:#fff;
}
.pager .btn:hover{background:var(--green-soft);border-color:#8EC79A}

.hero-actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  width:min(760px,100%);
  margin-top:4px;
}
.hero-actions .action-pill{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:13px 18px;
  border-radius:999px;
  text-align:center;
  white-space:nowrap;
}
.hero-actions .question-pill{
  background:rgba(255,255,255,.10);
  border-color:rgba(255,255,255,.72);
  color:#fff;
  cursor:default;
}
.hero-actions .platform-pill{
  background:rgba(17,82,32,.34);
  border-color:rgba(255,255,255,.72);
  color:#fff;
  gap:8px;
}
.hero-actions .platform-pill span{
  font-size:20px;
  line-height:1;
  transition:transform .18s ease;
}
.hero-actions .platform-pill:hover span{transform:translate(2px,-2px)}
@media (max-width:760px){
  .hero-actions{grid-template-columns:repeat(3,minmax(0,1fr));max-width:100%;gap:10px}
  .hero-actions .action-pill{min-height:52px;padding:12px 12px;font-size:14px}
  .hero-actions .platform-pill span{font-size:16px}
}
@media (max-width:760px){
  .top{padding:10px 14px}
  .brand{gap:9px}.brand img{height:43px}.top b{font-size:17px}
  .menu-btn{padding:9px 14px}
  .hero{padding-top:58px;padding-bottom:66px;min-height:520px}
  .hero h1{font-size:clamp(46px,15vw,82px)}
  .hero p{font-size:18px}
  .park h2{font-size:31px}
  .stub{min-height:150px}
}

/* ===== Diseño responsivo según dispositivo ===== */
html,body{width:100%;max-width:none}
body{display:block;margin:0;overflow-x:hidden}

  padding-right:clamp(24px,5vw,72px)!important;
}

 const housingAmount=housingTotalRow?extractHousingAmount(housingTotalRow[1]):housingDepositRow?extractHousingAmount(housingDepositRow[1]):"";
 const housingLabel=housingTotalRow?"Pago de alojamiento al llegar":housingDepositRow?"Depósito de alojamiento":"";
 const housingNote=housingTotalRow?"Este es el monto de alojamiento que debe pagarse al llegar. La renta semanal se muestra por separado.":housingDepositRow?"Este es el depósito de alojamiento. La renta semanal, si aplica, se muestra por separado.":"";
 const housingCallout=housingAmount?`<div class="housing-callout"><span class="eyebrow">Alojamiento</span><span class="title">${housingLabel}</span><span class="amount">${housingAmount}</span><span class="note">${housingNote}</span></div>`:"";
 const hs=q.house?`<div class="sec"><h3>Alojamiento</h3>${housingCallout}<table class="tbl">${q.house.map(r=>{const isTotal=/total a pagar al llegar/i.test(r[0]);const isDeposit=/^(dep[oó]sito|dep[oó]sito de alojamiento|dep[oó]sito de seguridad)$/i.test(String(r[0]).trim());const isWeekly=/renta de la primera semana|renta semanal|^renta$/i.test(r[0]);const highlight=isTotal||(!housingTotalRow&&isDeposit);return `<tr class="${highlight?'arrival-total-row':isWeekly?'weekly-rent-row':''}"><th${highlight?' class="arrival-total-label"':''}>${isTotal?'Pago de alojamiento al llegar':isWeekly?'Renta semanal':r[0]}</th><td>${r[1]}${isWeekly?'<small style="display:block;font-weight:700;color:#647067;margin-top:4px">Pago semanal separado</small>':''}</td></tr>`}).join("")}</table></div>`:"";
 const body=`<div class="sec"><h3>Funciones y condiciones de trabajo</h3><ul class="ul">${j.d.map(x=>`<li>${DU[x]}</li>`).join("")}</ul></div>`+(j.extra?``:"")+(j.uniform?`<div class="sec"><h3>Uniforme</h3><p>${j.uniform}</p></div>`:"")+(j.transport?`<div class="sec transport-info"><h3>Tiempo desde el housing al trabajo</h3><p>${j.transport}</p></div>`:"")+(q.imp?`<div class="sec"><h3>Importante</h3><p>${q.imp}</p></div>`:"")+hs;
 $("#job").innerHTML=`<div${q.hero?` class="head has-hero" style="--head-bg:url('${q.hero}')"`:' class="head"'}><a class="exit" href="#${q.id}">← ${j.park}</a><div class="where">${j.park}${j.sub&&!j.park.includes(j.sub)?" · "+j.sub:""}</div><h1>${j.title}</h1></div>
 <div class="cols"><div>${body}</div>${side([["Pago",j.pay,' class="pay"'],["Nivel de inglés",j.eng],["Estado",j.state||st(q)],["Ciudad",j.city||ct(q)],["Posición",j.title],["Género",q.gen],["Sitio web",q.web?`<a href="${q.web}" target="_blank" rel="noopener" style="color:inherit">${q.web.replace("https://www.","").replace(/\/$/,"")}</a>`:""]])}</div>${pager(L[n-1],L[n+1],q)}`;
}
addEventListener("hashchange",render);render();
</script>
